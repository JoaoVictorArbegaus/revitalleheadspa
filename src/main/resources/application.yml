spring:
  application:
    name: service-scheduling-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/service_scheduling}
    username: ${DATABASE_USERNAME:service_scheduling}
    password: ${DATABASE_PASSWORD:service_scheduling}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  shutdown: graceful

management:
  endpoint:
    health:
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: logstash
