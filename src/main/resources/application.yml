spring:
  application:
    name: service-scheduling-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/service_scheduling}
    username: ${DATABASE_USERNAME:service_scheduling}
    password: ${DATABASE_PASSWORD:service_scheduling}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

aplicacao:
  acesso:
    bootstrap:
      nome: ${BOOTSTRAP_PROPRIETARIO_NOME:}
      email: ${BOOTSTRAP_PROPRIETARIO_EMAIL:}
      senha: ${BOOTSTRAP_PROPRIETARIO_SENHA:}
    recuperacao:
      email: ${RECUPERACAO_PROPRIETARIO_EMAIL:}
      nova-senha: ${RECUPERACAO_PROPRIETARIO_NOVA_SENHA:}
    limite-tentativas:
      maximo: ${LOGIN_TENTATIVAS_MAXIMO:5}
      janela: ${LOGIN_TENTATIVAS_JANELA:15m}

server:
  shutdown: graceful
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:NONE}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        path: /api

management:
  endpoint:
    health:
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: logstash
