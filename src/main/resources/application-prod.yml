spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

springdoc:
  api-docs:
    enabled: ${OPENAPI_HABILITADA:false}
  swagger-ui:
    enabled: ${SWAGGER_UI_HABILITADA:false}

aplicacao:
  negocio:
    versao-aviso-privacidade: ${NEGOCIO_VERSAO_AVISO_PRIVACIDADE:}
    texto-aviso-privacidade: ${NEGOCIO_TEXTO_AVISO_PRIVACIDADE:}

server:
  servlet:
    session:
      cookie:
        secure: true
