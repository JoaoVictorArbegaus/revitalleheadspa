services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: service_scheduling
      POSTGRES_USER: service_scheduling
      POSTGRES_PASSWORD: service_scheduling
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service_scheduling -d service_scheduling"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/service_scheduling
      DATABASE_USERNAME: service_scheduling
      DATABASE_PASSWORD: service_scheduling
      BOOTSTRAP_PROPRIETARIO_NOME: ${BOOTSTRAP_PROPRIETARIO_NOME:?informe o nome do proprietario}
      BOOTSTRAP_PROPRIETARIO_EMAIL: ${BOOTSTRAP_PROPRIETARIO_EMAIL:?informe o email do proprietario}
      BOOTSTRAP_PROPRIETARIO_SENHA: ${BOOTSTRAP_PROPRIETARIO_SENHA:?informe a senha do proprietario}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
